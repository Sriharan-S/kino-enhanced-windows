name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, portable zip
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      # The protocol's canonical examples live in the main repo; the contract tests parse them.
      - uses: actions/checkout@v4
        with:
          repository: Sriharan-S/kino-enhanced
          path: _protocol

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fetch libmpv (pinned, SHA-1 verified)
        shell: pwsh
        run: ./tools/Fetch-LibMpv.ps1

      - name: Check formatting
        run: dotnet format whitespace Kino.slnx --verify-no-changes

      - name: Build
        run: dotnet build Kino.slnx -c Release -p:Platform=x64

      - name: Unit and contract tests
        env:
          KINO_PROTOCOL_DIR: ${{ github.workspace }}/_protocol/protocol
        run: dotnet test tests/Kino.Core.Tests -c Release --logger "console;verbosity=normal"

      - name: Portable build
        shell: pwsh
        run: ./tools/Publish-Portable.ps1 -Dotnet dotnet

      - uses: actions/upload-artifact@v4
        with:
          name: Kino-win-x64
          path: dist/*.zip
          retention-days: 14
